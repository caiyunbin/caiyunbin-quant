<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>caiman's quant · 管理后台</title>
<link href="https://cdn.staticfile.net/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
<style>
  body{background:#0f172a;color:#e2e8f0}
  .card{background:#1e293b;border:1px solid #334155}
  input,select{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:6px 10px}
  button{cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #334155;font-size:13px}
  th{color:#94a3b8;font-weight:600}
  .badge{padding:2px 8px;border-radius:999px;font-size:11px}
  .b-paid{background:#064e3b;color:#6ee7b7}
  .b-unpaid{background:#374151;color:#9ca3af}
  .b-banned{background:#7f1d1d;color:#fca5a5}
  .btn-p{background:#4f46e5;color:#fff;padding:6px 14px;border-radius:6px}
  .btn-s{background:#334155;color:#e2e8f0;padding:4px 10px;border-radius:6px;font-size:12px}
  .btn-d{background:#991b1b;color:#fff;padding:4px 10px;border-radius:6px;font-size:12px}
</style>
</head>
<body class="min-h-screen">

<div id="loginView" class="hidden min-h-screen flex items-center justify-center">
  <div class="card rounded-xl p-8 w-96">
    <h1 class="text-xl font-bold mb-1">🔐 管理后台</h1>
    <p class="text-sm text-gray-400 mb-5">caiman's quant system</p>
    <input id="li_email" type="email" placeholder="管理员邮箱" class="w-full mb-3">
    <input id="li_pw" type="password" placeholder="密码" class="w-full mb-4">
    <button onclick="doLogin()" class="btn-p w-full">登录</button>
    <p id="li_err" class="text-red-400 text-sm mt-3"></p>
  </div>
</div>

<div id="adminView" class="hidden max-w-7xl mx-auto px-4 py-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 管理后台</h1>
    <div class="text-sm text-gray-400">
      <span id="who"></span>
      <button onclick="doLogout()" class="btn-s ml-3">退出</button>
    </div>
  </div>

  <div id="stats" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6"></div>

  <div class="card rounded-xl p-5 mb-6">
    <h2 class="font-bold mb-3">➕ 开通 / 续费</h2>
    <div class="flex flex-wrap gap-3 items-end">
      <div><label class="text-xs text-gray-400 block mb-1">用户邮箱</label><input id="ac_email" type="email" placeholder="user@x.com"></div>
      <div><label class="text-xs text-gray-400 block mb-1">档位</label>
        <select id="ac_tier">
          <option value="month">月 (30天 ¥99)</option>
          <option value="quarter" selected>季 (90天 ¥266)</option>
          <option value="year">年 (360天 ¥799)</option>
        </select>
      </div>
      <div><label class="text-xs text-gray-400 block mb-1">实收金额</label><input id="ac_amount" type="number" placeholder="266" style="width:90px"></div>
      <div><label class="text-xs text-gray-400 block mb-1">收款备注/流水号</label><input id="ac_from" placeholder="微信 #..."></div>
      <button onclick="doActivate()" class="btn-p">开通</button>
      <span id="ac_msg" class="text-sm"></span>
    </div>
  </div>

  <div class="card rounded-xl p-5 mb-6">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold">👥 用户管理</h2>
      <div class="flex gap-2">
        <input id="u_q" placeholder="搜邮箱" style="width:160px" onkeydown="if(event.key==='Enter')loadUsers()">
        <select id="u_status" onchange="loadUsers()">
          <option value="">全部</option>
          <option value="paid">已付费</option>
          <option value="unpaid">未付费</option>
          <option value="expired">已过期</option>
          <option value="banned">封禁</option>
        </select>
        <select id="u_sort" onchange="loadUsers()">
          <option value="created">按注册时间</option>
          <option value="expiring">按即将到期</option>
          <option value="login">按最后登录</option>
        </select>
        <button onclick="loadUsers()" class="btn-s">刷新</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>邮箱</th><th>状态</th><th>到期</th><th>剩余</th><th>设备</th><th>注册</th><th>最后登录</th><th>操作</th></tr></thead>
        <tbody id="u_tbody"></tbody>
      </table>
    </div>
    <p id="u_count" class="text-xs text-gray-500 mt-2"></p>
  </div>

  <div class="card rounded-xl p-5">
    <h2 class="font-bold mb-3">💰 付费流水</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>邮箱</th><th>操作</th><th>档</th><th>天数</th><th>金额</th><th>收款</th><th>操作人</th></tr></thead>
        <tbody id="p_tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = "/api";
async function api(path, opts={}){
  const r = await fetch(API+path, {credentials:"include", headers:{"Content-Type":"application/json"}, ...opts});
  if(!r.ok){ const e = await r.json().catch(()=>({detail:r.status})); throw new Error(e.detail||r.status); }
  return r.json();
}
function fmtDate(s){ return s ? s.slice(0,10) : "—"; }
function fmtDateTime(s){ return s ? s.slice(0,16).replace("T"," ") : "—"; }

async function boot(){
  try{
    const me = await api("/me");
    if(me.logged_in && me.role==="admin"){ showAdmin(me); }
    else { showLogin(); }
  }catch(e){ showLogin(); }
}
function showLogin(){ document.getElementById("loginView").classList.remove("hidden"); document.getElementById("adminView").classList.add("hidden"); }
function showAdmin(me){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("adminView").classList.remove("hidden");
  document.getElementById("who").textContent = me.email;
  loadStats(); loadUsers(); loadPayments();
}
async function doLogin(){
  const email = document.getElementById("li_email").value.trim();
  const password = document.getElementById("li_pw").value;
  try{
    await api("/login", {method:"POST", body:JSON.stringify({email,password})});
    const me = await api("/me");
    if(me.role!=="admin"){ document.getElementById("li_err").textContent="该账号不是管理员"; return; }
    showAdmin(me);
  }catch(e){ document.getElementById("li_err").textContent = "登录失败: "+e.message; }
}
async function doLogout(){ await api("/logout",{method:"POST"}); location.reload(); }

async function loadStats(){
  const s = await api("/admin/stats");
  const cards = [
    ["总用户", s.total_users, "#60a5fa"],
    ["付费会员", s.paid_users, "#34d399"],
    ["7天内到期", s.expiring_7d, "#fbbf24"],
    ["今日新增", s.new_today, "#a78bfa"],
    ["累计收入", "¥"+(s.revenue_total||0), "#f472b6"],
    ["本月收入", "¥"+(s.revenue_month||0), "#22d3ee"],
  ];
  document.getElementById("stats").innerHTML = cards.map(([t,v,c])=>
    `<div class="card rounded-lg p-3"><div class="text-xs text-gray-400">${t}</div><div class="text-2xl font-bold" style="color:${c}">${v}</div></div>`
  ).join("");
}

async function loadUsers(){
  const q = document.getElementById("u_q").value.trim();
  const status = document.getElementById("u_status").value;
  const sort = document.getElementById("u_sort").value;
  const d = await api(`/admin/users?q=${encodeURIComponent(q)}&status=${status}&sort=${sort}`);
  document.getElementById("u_count").textContent = `共 ${d.count} 个用户`;
  document.getElementById("u_tbody").innerHTML = d.users.map(u=>{
    let badge = u.status==="banned" ? '<span class="badge b-banned">封禁</span>'
      : (u.paid_until && new Date(u.paid_until)>new Date()) ? '<span class="badge b-paid">付费</span>'
      : '<span class="badge b-unpaid">未付费</span>';
    return `<tr>
      <td>${u.email}</td><td>${badge}</td><td>${fmtDate(u.paid_until)}</td>
      <td>${u.days_left||0}天</td><td>${u.devices}</td>
      <td>${fmtDate(u.created_at)}</td><td>${fmtDateTime(u.last_login)}</td>
      <td>
        <button class="btn-s" onclick="quickExtend('${u.email}')">+30</button>
        <button class="btn-s" onclick="doKick('${u.email}')">踢</button>
        <button class="btn-d" onclick="doRevoke('${u.email}')">撤</button>
        <button class="btn-d" onclick="doBan('${u.email}', ${u.status==='banned'?'false':'true'})">${u.status==='banned'?'解封':'封'}</button>
      </td></tr>`;
  }).join("");
}

async function loadPayments(){
  const d = await api("/admin/payments?limit=50");
  document.getElementById("p_tbody").innerHTML = d.payments.map(p=>
    `<tr><td>${fmtDateTime(p.activated_at)}</td><td>${p.email}</td><td>${p.action}</td>
     <td>${p.tier||"—"}</td><td>${p.days||"—"}</td><td>${p.amount!=null?"¥"+p.amount:"—"}</td>
     <td>${p.paid_from||"—"}</td><td>${p.activated_by||"—"}</td></tr>`
  ).join("");
}

async function doActivate(){
  const email = document.getElementById("ac_email").value.trim();
  const tier = document.getElementById("ac_tier").value;
  const amount = parseFloat(document.getElementById("ac_amount").value)||null;
  const paid_from = document.getElementById("ac_from").value.trim();
  const msg = document.getElementById("ac_msg");
  if(!email){ msg.textContent="填邮箱"; msg.style.color="#fca5a5"; return; }
  try{
    const r = await api("/admin/activate",{method:"POST",body:JSON.stringify({email,tier,amount,paid_from})});
    msg.textContent = `✅ ${email} +${r.added_days}天 → ${fmtDate(r.paid_until)}`; msg.style.color="#6ee7b7";
    loadStats(); loadUsers(); loadPayments();
  }catch(e){ msg.textContent="❌ "+e.message; msg.style.color="#fca5a5"; }
}
async function quickExtend(email){ try{ await api("/admin/extend",{method:"POST",body:JSON.stringify({email,days:30})}); loadUsers(); loadStats(); loadPayments(); }catch(e){alert(e.message);} }
async function doRevoke(email){ if(!confirm("撤销 "+email+" 的会员?"))return; try{ await api("/admin/revoke",{method:"POST",body:JSON.stringify({email})}); loadUsers(); loadStats(); }catch(e){alert(e.message);} }
async function doBan(email,ban){ if(!confirm((ban?"封禁":"解封")+" "+email+"?"))return; try{ await api("/admin/ban",{method:"POST",body:JSON.stringify({email,ban})}); loadUsers(); }catch(e){alert(e.message);} }
async function doKick(email){ try{ await api("/admin/kick",{method:"POST",body:JSON.stringify({email})}); loadUsers(); }catch(e){alert(e.message);} }

boot();
</script>
</body>
</html>
