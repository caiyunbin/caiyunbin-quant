<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日信号 · 多子策略决策引擎</title>
    <link href="https://cdn.staticfile.net/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/auth.js"></script>
    <script src="assets/activity.js"></script>
    <script src="assets/compliance.js"></script>
    <script src="assets/nav.js"></script>
    <script src="assets/paywall.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<script>renderNav(false);</script>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
<div class="space-y-6">

    <div class="bg-white shadow rounded-lg p-4 sm:p-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-indigo-700 mb-1">🎯 今日信号</h1>
        <p class="text-gray-500 text-sm">三个子决策树当日候选股票 + 信号持续状态 + 信号出清建议 (T+1 开盘价撮合)</p>
        <p class="text-xs text-gray-400 mt-2" id="meta-info"></p>
    </div>

    <div id="strategy-cards" class="space-y-6">
        <!-- by JS: 每个策略 1 张大卡片 + 4 个状态分块 -->
    </div>

    <div class="bg-blue-50 border-l-4 border-blue-400 p-4 rounded">
        <h3 class="font-bold text-sm text-blue-900 mb-2">📖 状态说明</h3>
        <ul class="text-xs text-blue-900 list-disc list-inside space-y-1">
            <li><b>信号持续</b>: 该标的目前处于信号持续期, 继续保留观察</li>
            <li><b>明日离场信号</b>: 系统判定明日 T+1 集合竞价出清, 可作为出清参考</li>
            <li><b>明日开盘信号生成</b>: 候选标的池, ★★★ 最优, 用户应根据资金量在明日 T+1 开盘参考信号</li>
            <li><b>历史出清</b>: 最近 30 天的历史出清记录, 仅作研究参考</li>
        </ul>
        <p class="text-xs text-blue-700 mt-2">⚠️ 本系统输出"信号参考", 不真实下单, 不构成投资建议. 用户应自主判断、独立决策、风险自担.</p>
    </div>

</div>
</main>

<script>renderFooter();</script>

<script>
// 详细参数 (admin 才能看) + 模糊行情描述 (user 看)
const STRATEGY_INFO_ADMIN = {
    "大盘高位":   {en:"S2.G13", icon: "🏛️", pool: "A 股大盘股 (流通市值 ≥ 200 亿) — 连 3 日主力净流入 + 突破 20 日新高"},
    "低位横盘":   {en:"S4.V4", icon: "📈", pool: "A 股 amount_20d ≥ 5000万 — MA5>MA20>MA60 多头 5-29 天 + 横盘紧贴 MA5"},
};
const STRATEGY_INFO_USER = {
    "大盘高位":   {en:"S2.G13", icon: "🏛️", pool: "适配大盘股趋势行情. 在主力资金持续入场、市场风格切到价值蓝筹、指数突破前期高点时的 Alpha 爆发最强."},
    "低位横盘":   {en:"S4.V4", icon: "📈", pool: "适配震荡上行行情中的低波动洗盘期. 在大盘已在上升通道, 个股进入紧贴均线的窄幅盘整时的 Alpha 爆发最强."},
};
const STRATEGY_INFO = (typeof isAdmin === 'function' && isAdmin())
    ? STRATEGY_INFO_ADMIN : STRATEGY_INFO_USER;
const FMT_PCT = (x) => (x>=0?"+":"") + (x*100).toFixed(1) + "%";

async function loadJSON(p) {
    const r = await fetch(p + "?t=" + Date.now());
    if (!r.ok) throw new Error(p);
    return r.json();
}

(async function () {
    const me = await pwMe();
    pwUserBar(me);
    const sig = await pwSignals(me).catch(_=>null);
    const latest = sig ? sig.data : null;
    const LOCKED = sig ? sig.locked : true;
    if (!latest) {
        document.getElementById('strategy-cards').innerHTML =
            '<div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded"><h3 class="font-bold text-yellow-900">⚠ 数据尚未生成</h3></div>';
        return;
    }
    document.getElementById('meta-info').textContent =
        `信号日期 ${latest.meta.data_date} · 站点生成 ${latest.meta.generated_at}`;

    const signals = latest.daily_signals || {};
    const container = document.getElementById('strategy-cards');
    // ⚖️ 当前动态配比 + 权重更新时间 + 变化历史
    const _wm = latest.weights_meta || {};
    const _hist = _wm.history || [];
    const _lastChg = _wm.last_change || '-';
    const _rgNow = latest.regime || (latest.weights && latest.weights['S2.G13'] >= latest.weights['S4.V4'] ? '趋势市' : '震荡市');
    const _wpct = (k) => (((latest.weights && latest.weights[k]) || 0) * 100).toFixed(0);
    let outerHtml = `<div class="bg-gradient-to-br from-indigo-50 to-white border border-indigo-200 shadow rounded-lg p-4 sm:p-6">
        <div class="flex justify-between items-center flex-wrap gap-2 mb-3">
            <h2 class="text-lg font-bold text-indigo-800">⚖️ 当前动态配比 · <span class="text-indigo-600">${_rgNow}</span></h2>
            <span class="text-xs text-gray-500">权重更新于 <b class="text-indigo-700">${_lastChg}</b> (上次相位切换/调仓)</span>
        </div>
        <div class="flex flex-wrap gap-2 mb-3">
            <span class="text-sm bg-white border border-indigo-200 rounded px-3 py-1">🏛️ 大盘高位 <b class="text-indigo-700">${_wpct('S2.G13')}%</b></span>
            <span class="text-sm bg-white border border-indigo-200 rounded px-3 py-1">📈 低位横盘 <b class="text-indigo-700">${_wpct('S4.V4')}%</b></span>
            <span class="text-sm bg-white border border-sky-200 rounded px-3 py-1">🔄 ETF 轮动 <b class="text-sky-700">${_wpct('ETF.honest')}%</b></span>
        </div>
        <p class="text-xs text-gray-500">中证全指 &gt; 100日线 = 趋势市(大盘高位多配 45/25)，否则 = 震荡市(低位横盘多配 15/55)；ETF 固定 30%；每月首交易日按相位调仓。</p>
        ${_hist.length > 1 ? `<details class="mt-2"><summary class="cursor-pointer text-xs text-indigo-600 font-medium hover:text-indigo-800 select-none">权重变化历史 (近 ${Math.min(6,_hist.length)} 次) ▾</summary><ul class="mt-2 space-y-1 text-xs text-gray-600">${_hist.slice().reverse().map(h => `<li><span class="font-mono text-gray-700">${h.date}</span> 起 → <b>${h.regime}</b> <span class="text-gray-400">(大盘${(h.weights['S2.G13']*100).toFixed(0)}/横盘${(h.weights['S4.V4']*100).toFixed(0)}/ETF${(h.weights['ETF.honest']*100).toFixed(0)})</span></li>`).join('')}</ul></details>` : ''}
    </div>`;

    for (const strat of Object.keys(STRATEGY_INFO)) {
        const info = STRATEGY_INFO[strat];
        const s = signals[strat] || {};
        // 付费墙: 未付费 → 每个策略显示锁定卡片
        if (LOCKED) {
            outerHtml += `<div class="bg-white shadow rounded-lg p-4 sm:p-6 mb-5">
                <h2 class="text-lg font-bold text-gray-800 mb-3">${info.icon||''} ${strat}</h2>
                ${pwLockCard({title:"🔒 完整信号已锁定", sub:"明日重磅信号 · 持续跟踪 · 离场 — 付费会员可见", counts:[
                    {label:"明日信号", n:(s.buy_today_count ?? (s.buy_today||[]).length)},
                    {label:"跟踪中", n:(s.holding_count ?? 0)},
                    {label:"离场", n:(s.sell_today_count ?? 0)},
                ]})}
            </div>`;
            continue;
        }
        const isEmpty = (!s.holding || s.holding.length===0) && (!s.buy_today || s.buy_today.length===0) && (!s.sell_today || s.sell_today.length===0);
        // ⭐ 防御观望: 无持仓 = 策略当前按纪律不建仓, buy_today 仅为候选观察池
        // (避免"显示明日重磅信号却从不持仓"的矛盾, 与策略防御空仓状态保持诚实一致)
        const flat = (!s.holding || s.holding.length===0);

        let buyHtml = '';
        if (s.buy_today && s.buy_today.length > 0) {
            buyHtml = s.buy_today.slice(0, 8).map((item, i) => {
                // ⭐ V27.3: buy_today 元素可能是 string (老格式) 或 dict {ts_code, p_up, p_1d, p_3d, p_5d}
                const ts = (typeof item === 'string') ? item : (item.ts_code || '?');
                const p_up = (typeof item === 'object' && item.p_up != null) ? item.p_up : null;
                let star = '';
                if (flat) star = '<span class="text-xs text-gray-400">观察 ' + (i+1) + '</span>';
                else if (i === 0) star = '<span class="text-yellow-500 text-lg">★★★</span><span class="text-xs text-gray-400 ml-1">重磅</span>';
                else if (i === 1) star = '<span class="text-yellow-500">★★</span>';
                else if (i === 2) star = '<span class="text-yellow-500">★</span>';
                else star = '<span class="text-xs text-gray-400">候选</span>';
                const pupBadge = (p_up !== null)
                    ? `<span class="text-xs text-blue-600 ml-2" title="综合信号强度">强度 ${(p_up*100).toFixed(0)}</span>`
                    : '';
                return `<li class="bg-white px-3 py-2 rounded text-xs flex justify-between items-center">
                    <span class="flex items-center"><span class="font-mono font-bold text-green-700">${ts}</span>${pupBadge}</span>
                    <span>${star}</span>
                </li>`;
            }).join('');
        } else {
            buyHtml = '<p class="text-xs text-gray-500">今日暂无信号</p>';
        }

        let holdHtml = '';
        if (s.holding && s.holding.length > 0) {
            holdHtml = s.holding.map(h =>
                `<li class="bg-white px-3 py-2 rounded text-xs flex justify-between flex-wrap gap-1">
                    <span class="font-mono font-bold text-blue-700">${h.ts_code}</span>
                    <span class="text-gray-500">纳入 ${h.entry_date}</span>
                </li>`
            ).join('');
        } else holdHtml = '<p class="text-xs text-gray-500">暂无跟踪标的</p>';

        let sellHtml = '';
        if (s.sell_today && s.sell_today.length > 0) {
            sellHtml = s.sell_today.map(x =>
                `<li class="bg-white px-3 py-2 rounded text-xs">
                    <div class="flex justify-between flex-wrap gap-1">
                        <span class="font-mono font-bold text-red-700">${x.ts_code}</span>
                        <span class="${x.ret >= 0 ? 'text-green-600' : 'text-red-500'} font-bold">${FMT_PCT(x.ret)}</span>
                    </div>
                    <div class="text-gray-500 mt-1">纳入 ${x.entry_date} · ${pwReason(x.reason)}</div>
                </li>`
            ).join('');
        } else sellHtml = '<p class="text-xs text-gray-500">今日无离场信号</p>';

        let exitedHtml = '';
        if (s.exited_recent && s.exited_recent.length > 0) {
            const _exAll = s.exited_recent.slice().reverse();   // 最近的在前
            const _exLi = x =>
                `<li class="bg-white px-3 py-2 rounded text-xs">
                    <div class="flex justify-between flex-wrap gap-1">
                        <span class="font-mono text-gray-700">${x.ts_code}</span>
                        <span class="${x.ret >= 0 ? 'text-green-600' : 'text-red-500'} font-bold">${FMT_PCT(x.ret)}</span>
                    </div>
                    <div class="text-gray-500 mt-1">纳入 ${x.entry_date} → 退 ${x.exit_date} · ${pwReason(x.reason)}</div>
                </li>`;
            exitedHtml = '<ul class="space-y-2">' + _exAll.slice(0,3).map(_exLi).join('') + '</ul>';
            if (_exAll.length > 3) {
                exitedHtml += '<details class="mt-2"><summary class="list-none cursor-pointer text-xs text-indigo-600 font-medium hover:text-indigo-800 select-none">查看全部 ' + _exAll.length + ' 笔 ▾</summary>'
                    + '<ul class="space-y-2 mt-2">' + _exAll.slice(3).map(_exLi).join('') + '</ul></details>';
            }
        } else exitedHtml = '<p class="text-xs text-gray-500">近期无离场</p>';

        outerHtml += `<div class="bg-white shadow rounded-lg p-4 sm:p-6 ${flat?'border-l-4 border-amber-300':''}">
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-800">${info.icon} ${strat}${flat?' <span class="text-sm text-amber-600 font-normal">(空仓观望)</span>':''}</h2>
                <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">权重 ${(((latest.weights&&latest.weights[info.en])||0)*100).toFixed(0)}%</span>
            </div>
            <p class="text-xs text-gray-500 mb-4">${info.pool}</p>

            ${flat ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-4">
                <p class="text-sm text-amber-800 font-bold">💤 策略当前防御性空仓</p>
                <p class="text-xs text-amber-700 mt-1">${(s.buy_today&&s.buy_today.length>0) ? '下方为候选观察池，策略按纪律暂不建仓；待大盘择时转好，策略会自动恢复建仓，届时此处显示持仓与离场信号。' : '当前无持仓、无候选，空仓等待机会出现。'}</p>
            </div>` : ''}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                <div class="bg-blue-50 rounded-lg p-4">
                    <h3 class="text-sm font-bold text-blue-900 mb-3">📦 持续跟踪中 (${(s.holding||[]).length})</h3>
                    <ul class="space-y-2">${holdHtml}</ul>
                </div>
                <div class="bg-red-50 rounded-lg p-4">
                    <h3 class="text-sm font-bold text-red-900 mb-3">📤 明日离场信号 (${(s.sell_today||[]).length})</h3>
                    <ul class="space-y-2">${sellHtml}</ul>
                </div>
                <div class="${flat?'bg-gray-50':'bg-green-50'} rounded-lg p-4">
                    <h3 class="text-sm font-bold ${flat?'text-gray-700':'text-green-900'} mb-3">${flat ? '📋 候选观察池 ('+(s.buy_today||[]).length+') · 暂不建仓' : '🎯 明日重磅信号 ('+Math.min(3,(s.buy_today||[]).length)+') · 候选 ('+Math.max(0,(s.buy_today||[]).length-3)+')'}</h3>
                    <ul class="space-y-2">${buyHtml}</ul>
                </div>
                <div class="bg-gray-100 rounded-lg p-4">
                    <h3 class="text-sm font-bold text-gray-700 mb-3">✓ 近期已离场 (${(s.exited_recent||[]).length})</h3>
                    ${exitedHtml}
                </div>
            </div>
        </div>`;
    }

    // ETF 轮动腿 (无个股信号, 显示当前持有的 ETF + 相位)
    const _ew = (latest.weights && latest.weights['ETF.honest']) || 0.30;
    const _es = latest.etf_state || {};
    const _eh = _es.holdings || [];
    const _regime = latest.regime || (latest.weights && latest.weights['S2.G13'] >= latest.weights['S4.V4'] ? '趋势市' : '震荡市');
    const _eth = (_es.trade_history || []).slice(-15).reverse();   // 最新15笔 (最近的在前)
    outerHtml += `<div class="bg-white shadow rounded-lg p-4 sm:p-6 border-l-4 border-sky-300">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800">🔄 ETF 轮动</h2>
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">权重 ${(_ew*100).toFixed(0)}%</span>
        </div>
        <p class="text-xs text-gray-500 mb-4">境内板块轮动单押最强簇 + 大盘 regime 择时 + 纳指(^NDX)&gt;200日线时叠加 513100 纳指ETF。该腿无个股信号，按持有 ETF 操作。</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
            <div class="bg-sky-50 rounded-lg p-4">
                <h3 class="text-sm font-bold text-sky-900 mb-2">📦 当前持有 (${_eh.length})</h3>
                ${_eh.length>0 ? '<ul class="space-y-2">'+_eh.map(h=>`<li class="bg-white px-3 py-2 rounded text-xs font-mono font-bold text-sky-700">${typeof h==='string'?h:(h.ts_code||h)}</li>`).join('')+'</ul>' : '<p class="text-xs text-gray-500">空仓 (持现金 / 等纳指趋势)</p>'}
                <p class="text-xs text-gray-400 mt-2">最近运行 ${_es.last_run_date||'-'} · 当前相位 ${_regime}</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-4">
                <h3 class="text-sm font-bold text-gray-700 mb-2">📑 最近成交 (${_eth.length})</h3>
                ${_eth.length>0 ? '<ul class="space-y-2">'+_eth.map(t=>`<li class="bg-white px-3 py-2 rounded text-xs"><div class="flex justify-between flex-wrap gap-1"><span class="font-mono text-gray-700">${t.ts_code}</span><span class="${(t.ret||0)>=0?'text-green-600':'text-red-500'} font-bold">${FMT_PCT(t.ret||0)}</span></div><div class="text-gray-500 mt-1">${t.entry_date} → ${t.exit_date||'持有中'} · ${t.hold_days||0}天 · ${t.reason||''}</div></li>`).join('')+'</ul>' : '<p class="text-xs text-gray-500">暂无成交记录</p>'}
            </div>
        </div>
    </div>`;

    container.innerHTML = outerHtml;
})();
</script>

<!-- ⭐ 已移除 60s 整页 location.reload(): 信号每日仅晚间更新一次, 每分钟整页重载会导致页面"一闪一闪"且毫无意义. 需要最新数据手动刷新即可. -->
</body>
</html>
