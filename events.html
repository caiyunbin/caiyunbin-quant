<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件驱动 · 多子策略决策引擎</title>
    <link href="https://cdn.staticfile.net/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
      /* 事件驱动样式 */
      .event-subtab-btn { color: #6b7280; background: transparent; border: 0; cursor: pointer; }
      .event-subtab-btn.active { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }
      .hype-name { display:flex; flex-direction:column; justify-content:center; height:44px; width:100%; text-align:left; padding:0 6px; font-size:11px; font-weight:600; color:#374151; border-radius:6px; cursor:pointer; line-height:1.15; overflow:hidden; }
      .hype-name.sel { background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff; }
      .hype-name:hover:not(.sel){ background:#f5f3ff; }
      .hype-lane { position:relative; height:44px; cursor:pointer; border-radius:6px; }
      .hype-lane:hover, .hype-lane.sel { background:#faf5ff; }
      .hype-node { position:absolute; top:50%; transform:translate(-50%,-50%); padding:7px; cursor:pointer; background:transparent; border:0; }
      .hype-dot { display:block; width:9px; height:9px; border-radius:9999px; background:#c084fc; border:2px solid #fff; box-shadow:0 0 0 1px #e9d5ff; }
      .hype-dot.sel { background:#ec4899; box-shadow:0 0 0 2px #fbcfe8; }
      .hype-line { position:absolute; top:50%; height:2px; transform:translateY(-50%); background:#e9d5ff; border-radius:2px; pointer-events:none; }
      .hype-line.sel { background:linear-gradient(90deg,#a855f7,#ec4899); }
      .hb { font-size:10px; padding:1px 6px; border-radius:9999px; font-weight:700; white-space:nowrap; }
      .hb-major { background:#fee2e2; color:#b91c1c; }
      .hb-new { background:#dcfce7; color:#15803d; }
      /* 主线时间线总览图 (共享时间轴: 事件按真实日期落点, 圈大小=重要度) */
      .htl-row { display:flex; align-items:center; gap:8px; padding:3px 4px; border-radius:8px; text-decoration:none; }
      a.htl-row:hover { background:#faf5ff; }
      .htl-axisrow { padding-bottom:1px; margin-bottom:2px; }
      .htl-label { width:150px; flex-shrink:0; overflow:hidden; }
      .htl-th { font-size:12px; font-weight:700; color:#1f2937; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .htl-rank { display:inline-block; min-width:14px; color:#cbd5e1; font-weight:800; font-size:11px; }
      .htl-sub { font-size:9.5px; color:#9ca3af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
      .htl-track { position:relative; flex:1 1 auto; min-width:0; height:26px; }
      .htl-axis { height:14px; }
      .htl-tick { position:absolute; top:0; transform:translateX(-50%); font-size:10px; color:#9ca3af; white-space:nowrap; }
      .htl-gl { position:absolute; top:3px; bottom:3px; width:1px; background:#f1f5f9; transform:translateX(-50%); }
      .htl-gl.now { background:#fecaca; }
      .htl-base { position:absolute; top:50%; height:3px; transform:translateY(-50%); background:linear-gradient(90deg,#ede9fe,#c4b5fd); border-radius:3px; }
      .htl-ev { position:absolute; top:50%; transform:translate(-50%,-50%); border-radius:9999px; background:#c084fc; border:1px solid #fff; box-shadow:0 0 0 1px #e9d5ff; cursor:pointer; }
      .htl-ev.major { background:#dc2626; box-shadow:0 0 0 1px #fecaca; }
      .htl-ev.latest { outline:2px solid #f9a8d4; outline-offset:1px; }
      .htl-legend { font-size:10px; color:#9ca3af; margin-top:9px; padding-top:8px; border-top:1px solid #f1f5f9; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
      @media (max-width:480px){ .htl-label{width:104px} .htl-th{font-size:11px} }
      .day-btn { padding: 6px 14px; border-radius: 7px; font-weight: 500; font-size: 13px; color: #4b5563; background: transparent; border: 0; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 6px; }
      .day-btn.active { background: white; color: #6366f1; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-weight: 600; }
      .day-btn .day-count { background: #fef3c7; color: #92400e; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
      .day-btn.active .day-count { background: #ddd6fe; color: #5b21b6; }
      .event-card { position: relative; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.04); border: 1px solid #e5e7eb; transition: all 0.25s ease; }
      .event-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.08); }
      .rank-badge { position: absolute; top: 0; left: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: white; border-bottom-right-radius: 14px; z-index: 2; }
      .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
      .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); }
      .rank-3 { background: linear-gradient(135deg, #fdba74, #f97316); }
      .rank-other { background: linear-gradient(135deg, #818cf8, #6366f1); font-size: 18px; }
      .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
      .chip-channel { background: #fef3c7; color: #92400e; }
      .chip-time { background: #f3f4f6; color: #4b5563; }
      .chip-topic { background: #e0e7ff; color: #4338ca; }
      .chip-pattern { background: #fce7f3; color: #be185d; font-family: monospace; }
      .scope-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 7px; font-weight: 600; font-size: 12px; }
      .scope-paradigm_shift { background: #fae8ff; color: #86198f; }
      .scope-global { background: #dbeafe; color: #1e40af; }
      .scope-industry { background: #dcfce7; color: #166534; }
      .scope-multi_company { background: #fef3c7; color: #92400e; }
      .scope-single_company { background: #fee2e2; color: #991b1b; }
      .scope-local { background: #f3e8ff; color: #6b21a8; }
      .big-score { font-size: 44px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .dim-card { background: #f9fafb; border-radius: 8px; padding: 8px 10px; border: 1px solid #e5e7eb; }
      .score-bar { position: relative; height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
      .score-bar-fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #f59e0b, #ef4444 50%, #10b981); }
      .similar-case { background: linear-gradient(135deg, #fef9c3, #fef3c7); border-left: 4px solid #f59e0b; border-radius: 8px; padding: 10px; }
      .stock-row { background: #fafbfc; border-radius: 8px; padding: 8px 12px; border: 1px solid #e5e7eb; }
      details[open] summary .chev { transform: rotate(180deg); }
      .chev { transition: transform 0.2s ease; display: inline-block; }
    </style>
    <script src="assets/auth.js"></script>
    <script src="assets/activity.js"></script>
    <script src="assets/compliance.js"></script>
    <script src="assets/nav.js"></script>
    <script>requireAuth();</script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<script>renderNav(false);</script>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
<div class="space-y-6">

    <!-- 顶部 banner -->
    <div class="bg-gradient-to-r from-purple-600 via-pink-500 to-rose-500 rounded-2xl p-5 sm:p-6 text-white shadow-lg">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold mb-1">📡 事件驱动 · 实时榜单</h1>
                <p class="text-purple-100 text-xs sm:text-sm">财联社 加红 / 港美股 / 公司 / 提醒 · Engine_M v7 · ECS 每小时整点刷新</p>
                <p class="text-purple-100/80 text-xs mt-1" id="events-meta">加载中…</p>
            </div>

        </div>

    <!-- 阈值说明 -->
    <div class="bg-white shadow rounded-xl p-4 sm:p-5 border-l-4 border-purple-500">
        <div class="flex items-start gap-3">
            <div class="text-2xl">🎯</div>
            <div class="flex-grow text-xs sm:text-sm text-gray-600 leading-relaxed">
                <div class="font-bold text-gray-800 mb-1">什么样的分数算"高重要度"?</div>
                <span id="events-threshold-desc">回测得出…</span>
            </div>

    </div>

    <!-- 子 Tab: 7日 / 日榜 -->
    <div class="flex items-center justify-center">
        <div class="inline-flex bg-white rounded-xl p-1 shadow-sm border border-gray-200" id="events-subtabs">
            <button class="event-subtab-btn active px-4 py-2 rounded-lg font-semibold text-sm transition" data-subtab="hype">🔥 炒作脉络</button>
            <button class="event-subtab-btn px-4 py-2 rounded-lg font-semibold text-sm transition" data-subtab="weekly">📊 7日汇总</button>
            <button class="event-subtab-btn px-4 py-2 rounded-lg font-semibold text-sm transition" data-subtab="daily">📅 3日榜单</button>
        </div>
    </div>

    <div id="events-hype" class="space-y-4">
        <!-- by JS: 炒作脉络主线 -->
    </div>
    <div id="events-weekly" class="space-y-4" hidden>
        <!-- by JS: weekly Top 10 -->
    </div>
    <div id="events-daily" class="space-y-4" hidden>
        <div class="bg-white rounded-xl p-3 shadow-sm flex items-center justify-center">
            <div class="inline-flex bg-gray-100 rounded-lg p-1 gap-1" id="events-day-tabs">
                <!-- by JS: 今/昨/前 -->
            </div>
        </div>
        <div id="events-day-content" class="space-y-4"></div>
    </div>

</div>
</main>

<script>renderFooter();</script>

<script>
const EV_FMT = (x, d) => (typeof x === 'number') ? x.toFixed(d || 1) : '—';
// 全局状态: 记住用户当前看哪个 tab / 哪一天, in-place 刷新不丢失
let EV_DATA = null;          // 最近一次 fetch 的 events.json
let EV_CUR_DAY = 0;          // 当前选中日 (0=今/1=昨/2=前)
let EV_CUR_SUBTAB = 'hype';  // 当前子tab (hype/weekly/daily)
const EV_SCOPE_LABEL = {
    paradigm_shift: ['🌟', '范式突破'], global: ['🌍', '全球级'],
    industry: ['🏭', '全行业'], multi_company: ['🔗', '产业链'],
    single_company: ['🏢', '单公司'], local: ['📍', '区域性'],
};
const HOT_THRESHOLD = 60;  // 爆款档 (高于合格档 34)

// 📖 把 LLM 的内部推演文字洗成"人话"+ 分段分行
// 剥掉 Step/范式/矩阵/[Pxx]/win%/枚举裁决 等内部行话, 只留可读的因果分析
function formatChain(chain) {
    if (!chain) return '';
    let s = ' ' + String(chain) + ' ';

    // ① 去掉"阶段/步骤"脚手架标签 (多种写法), 仅删标签、保留其后正文
    s = s.replace(/【\s*Stage\s*[A-Za-z][^】]*】/g, '\n');
    s = s.replace(/【\s*Step\s*-?\d+(?:-\d+)?\s*[:：][^】]*】/g, '\n');
    s = s.replace(/\[\s*Step\s*-?\d+(?:-\d+)?\s*\]\s*(?:event_type|impact_scope|topic_class|event_subtype)\s*=\s*[\w一-龥]+\s*[:：。]?/g, '\n');
    s = s.replace(/\[\s*Step\s*-?\d+(?:-\d+)?\s*\]\s*[:：]?/g, '\n');
    s = s.replace(/Step\s*-?\d+(?:-\d+)?\s*[（(][^)）]*[)）]\s*[:：]?/g, '\n');
    s = s.replace(/Step\s*-?\d+(?:-\d+)?\s*[一-龥]{0,8}?\s*[:：]/g, '\n');

    // ② 去掉行内行话 token + markdown 强调符
    s = s.replace(/\*+/g, '');
    s = s.replace(/\[P\d+(?:\s[^\]]*)?\]/g, '');
    s = s.replace(/\bP\d{2}\b/g, '');
    s = s.replace(/[（(]\s*[×xX]\s*[\d.]+\s*[)）]/g, '');
    s = s.replace(/[（(]\s*n\s*=[^)）]*[)）]/g, '');
    s = s.replace(/[（(][^)）]{0,40}win%[^)）]*[)）]/g, '');
    s = s.replace(/\[教训\d+\]/g, '');
    s = s.replace(/(?:event_type|impact_scope|topic_class|event_subtype)\s*=\s*[\w一-龥]+/g, '');
    s = s.replace(/\b(?:event_driven|non_event|market_review|global|industry|multi_company|single_company|regional|paradigm_shift)\b/gi, '');
    s = s.replace(/[→\s]*影响范围[达为到]?\s*级别/g, '');
    s = s.replace(/[达到为]\s*级别/g, '');

    // ③ 去掉"应用/适用/查矩阵"前缀
    s = s.replace(/(应用|适用|采用|套用)[一-龥]{0,8}[:：]/g, '');
    s = s.replace(/查矩阵[:：]/g, '');

    // ④ 按句切分; 丢掉机器味整句 + 清掉裁决引导词残尾
    const out = [];
    s.split(/[\n。]/).forEach(raw => {
        let c = raw.replace(/^[\s,，、;；:：.。\-—~～→]+/, '').replace(/[\s→]+$/, '').replace(/\s{2,}/g, ' ').trim();
        c = c.replace(/[，,、]\s*(选为?|判定为|判为|故判|定为|故定为|归为|定级为|属于)$/, '').trim();
        if (c.length < 4) return;
        if (/矩阵|最优范式|范式选择|适用范式|备选范式|win%|\bn\s*=\s*\d|comp\s*=/.test(c)) return;
        out.push(c);
    });
    if (!out.length) return '';

    // ⑤ 分段分行: 因果链(≥2个→)整段加左竖线强调, 其余普通段; 关键内容标红标粗
    return out.map(c => {
        const isChain = (c.match(/→/g) || []).length >= 2;
        return isChain
            ? `<div class="mb-2 pl-2.5 border-l-2 border-purple-200 leading-relaxed">${hlKey(c)}</div>`
            : `<div class="mb-1.5 leading-relaxed">${hlKey(c)}</div>`;
    }).join('');
}

function evRenderCard(grp, rank_num, threshold) {
    const scope_info = EV_SCOPE_LABEL[grp.impact_scope] || ['❓', '?'];
    const rank_class = rank_num === 1 ? 'rank-1' : rank_num === 2 ? 'rank-2' : rank_num === 3 ? 'rank-3' : 'rank-other';
    const rank_label = rank_num === 1 ? '🥇' : rank_num === 2 ? '🥈' : rank_num === 3 ? '🥉' : '#' + rank_num;
    const qualified = grp.max_rank >= threshold;

    const REL_ORD = {'直接主体':6,'技术突破':5,'产业链':4,'控股参股':3,'海外映射':2,'同业竞品':1,'主题概念':0};
    const _relStyle = (typeof REL_STYLE !== 'undefined') ? REL_STYLE : {};
    const _stockRow = st => `
        <div class="stock-row">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center gap-2 flex-grow min-w-0">
                    <code class="text-xs text-gray-500 font-mono">${st.ts_code}</code>
                    <strong class="text-gray-800">${st.stock_name || ''}</strong>
                    <span class="chip chip-topic">${(st.segment || '—').slice(0,14)}</span>
                    ${st.overheated ? `<span class="text-xs text-red-600">🔥 已过热${st.pre_run_up_3d ? '+' + st.pre_run_up_3d.toFixed(1) + '%' : ''}</span>` : ''}
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <span class="font-semibold" style="color:${(st.expected_return_pct>=0)?'#dc2626':'#16a34a'}" title="预期涨幅 / 预期持续天数">${(st.expected_return_pct >= 0 ? '+' : '')}${EV_FMT(st.expected_return_pct, 1)}% · 持续${st.expected_duration_days || 0}天</span>
                    <span class="text-gray-500" title="预计见效时间窗口 (T+1~T+3 个交易日内)">${st.expected_window || ''}</span>
                    <span class="px-2 py-0.5 bg-purple-100 text-purple-700 rounded font-bold text-sm" title="该股综合评分">${EV_FMT(st.rank_score, 0)}</span>
                </div>
            </div>
            ${st.leader_detail ? `<div class="text-xs text-gray-400 mt-1" title="相对该股自己过去20日的资金/涨幅异动 (z-score, 越高越异常)">
                📊 资金异动 <span class="${(st.leader_detail.mf_z||0) >= 0.8 ? 'text-red-600 font-semibold' : ((st.leader_detail.mf_z||0) < -0.5 ? 'text-green-600' : 'text-gray-500')}">z=${(st.leader_detail.mf_z!=null?st.leader_detail.mf_z:'—')}</span>
                · 涨幅异动 <span class="${(st.leader_detail.ret_z||0) >= 0.8 ? 'text-red-600 font-semibold' : 'text-gray-500'}">z=${(st.leader_detail.ret_z!=null?st.leader_detail.ret_z:'—')}</span>${st.leader_detail.ret_3d_pct!=null?` (近3日${st.leader_detail.ret_3d_pct>=0?'+':''}${st.leader_detail.ret_3d_pct}%)`:''}
                · 市值${st.leader_detail.circ_mv_yi >= 10000 ? (st.leader_detail.circ_mv_yi/10000).toFixed(1)+'万亿' : st.leader_detail.circ_mv_yi+'亿'}
            </div>` : ''}
            <div class="text-xs text-gray-600 mt-2 leading-relaxed">
                <span class="text-gray-400 font-medium">📌 理由:</span> ${hlKey((st.rec_reason || '').slice(0, 180))}
            </div>
        </div>`;
    const _byRel = {};
    (grp.stocks || []).forEach(st => { const r = st.relation_type || '主题概念'; (_byRel[r] = _byRel[r] || []).push(st); });
    const stocks_html = Object.keys(_byRel).sort((a,b)=>(REL_ORD[b]||0)-(REL_ORD[a]||0)).map(rel => {
        const rs = _relStyle[rel] || {bg:'#475569',fg:'#f1f5f9',dot:'#94a3b8'};
        return `<div class="rounded-lg p-2.5 mb-2.5" style="background:${rs.dot}0d;border:1px solid ${rs.dot}2b">
            <div class="mb-2"><span class="text-[11px] font-bold px-2 py-0.5 rounded" style="background:${rs.bg};color:${rs.fg}">${rel}</span></div>
            <div class="space-y-2">${_byRel[rel].map(_stockRow).join('')}</div>
        </div>`;
    }).join('');

    const similar_html = (grp.similar_cases || []).map(c => `
        <div class="similar-case">
            <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-amber-700 font-mono">${c.event_date}</span>
                    <strong class="text-amber-900 text-sm">${(c.event_headline || '').slice(0, 50)}</strong>
                </div>
                <span class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-bold text-xs">${c.label}</span>
            </div>
            <div class="text-xs text-amber-900 space-y-1">
                <div><strong>${c.ts_code} ${c.stock_name}</strong> <span class="text-amber-700">(${c.segment || ''})</span></div>
                <div class="grid grid-cols-3 gap-2 text-xs bg-white/50 rounded p-2">
                    <div>T+5: <strong class="text-green-700">${((c.return_5d || 0)*100).toFixed(1)}%</strong></div>
                    <div>峰值: <strong class="text-green-700">${((c.peak_return || 0)*100).toFixed(1)}%</strong> @d${c.peak_day || 0}</div>
                    <div>持续: <strong>${c.days_above_3pct || 0}</strong>天</div>
                </div>
                <div class="text-amber-800 mt-1">📌 当时理由: ${(c.rec_reason || '').slice(0, 100)}</div>
            </div>
        </div>
    `).join('');

    const decay_chip = (grp.day_offset && grp.day_offset > 0) ? `
        <div class="text-xs mt-1 text-gray-400" title="原始分 ${EV_FMT(grp.raw_rank, 1)}, 衰减 ×${EV_FMT(grp.decay_factor, 2)}">
            🕒 ${grp.day_offset} 天前 · 原始 ${EV_FMT(grp.raw_rank, 1)}
        </div>` : '';

    return `
    <div class="event-card">
        <div class="rank-badge ${rank_class}">${rank_label}</div>
        <div class="p-4 sm:p-5 pl-16 sm:pl-20">
            <div class="flex items-start justify-between gap-3 flex-wrap mb-3">
                <div class="flex-grow min-w-0">
                    <h3 class="text-base sm:text-lg font-bold text-gray-800 leading-snug">
                        ${hlKey(grp.event_headline || (grp.raw_title || '').slice(0,40))}
                    </h3>
                    <div class="flex items-center flex-wrap gap-1.5 mt-2">
                        <span class="chip chip-channel">🔵 ${grp.news_channel || '未分类'}</span>
                        ${grp.news_pub_time ? `<span class="chip chip-time">⏰ ${grp.news_pub_time.slice(5, 16)}</span>` : ''}
                        ${grp.topic_class ? `<span class="chip chip-topic">🏷️ ${grp.topic_class}</span>` : ''}

const REL_STYLE = {

function evEsc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function evSpark(arr, up){

let HYPE_THREADS = [];

function _hDayDiff(a,b){ return Math.round((new Date(a+'T00:00') - new Date(b+'T00:00'))/86400000); }
// 关键内容标红标粗: 主线关键词 + 内置强词 + 带单位数字 (单趟正则, 不重复包裹)
function hlKey(text, kws){
    let s = evEsc(text||'');
    const STRONG = ['首次','独家','唯一','龙头','第一','突破','涨停','跌停','中标','签约','量产','认证','超预期','新高','重组','收购','停产','断供','制裁','反制','满产','涨价','提价','开工','投产'];
    const uniq = [...new Set([...(kws||[]), ...STRONG].filter(k=>k&&k.length>=2))]
        .sort((a,b)=>b.length-a.length).map(k=>evEsc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const numPat = '\\d[\\d.,]*\\s*(?:%|亿元|亿|万元|万|倍|个百分点|GW|nm)';
    let re; try{ re = new RegExp('('+[numPat].concat(uniq).join('|')+')','g'); }catch(e){ return s; }
    return s.replace(re, '<strong style="color:#dc2626">$1</strong>');
}
function _hypeBadges(t){

    const maxRank = Math.max(0, ...((t.events||[]).map(e=>e.rank||0)));
    if(maxRank >= 50) b += '<span class="hb hb-major">🔴 重大事件</span>';
    try { if(t.last_date && (Date.now() - new Date(t.last_date+'T00:00').getTime()) <= 2.5*86400000) b += '<span class="hb hb-new">🆕 最新</span>'; } catch(e){}

}
function evRenderHype(d){
    const root = document.getElementById('events-hype');
    if(!d || !d.threads || !d.threads.length){ root.innerHTML = '<div class="bg-white rounded-xl p-6 text-center text-gray-400 text-sm">暂无炒作主线</div>'; return; }
    // 主线重要度重排: 越新越靠前(主导), 历史上发生过重大事件次之(辅助), 不按事件数量
    (() => {
        const _toDay = s => Math.round(new Date(s+'T00:00:00Z').getTime()/86400000);
        const _today = _toDay((d.generated_at||'').slice(0,10) || new Date().toISOString().slice(0,10));
        d.threads.forEach(t => {
            const evs = (t.events||[]).filter(e => e.date);
            if(!evs.length){ t._imp = -1; return; }
            const lastDay = Math.max(...evs.map(e => _toDay(e.date)));
            const recency = Math.exp(-Math.max(0, _today-lastDay)/8);                  // 越新越大 (主导项)
            const peak = Math.min(100, Math.max(0, ...evs.map(e => e.rank||0)))/100;    // 历史峰值 = 是否发生过重大事件 (辅助项)
            t._imp = recency + 0.20*peak;
        });
        d.threads.sort((a,b) => (b._imp||0) - (a._imp||0));
    })();
    // 顶部总览: 共享时间轴的主线时间线图 (事件按真实日期落点, 圈大小=重要度, 红=重大, 末点高亮, 淡线=存续区间)
    const summary = (() => {
        const threads = d.threads || [];
        const toDay = s => Math.round(new Date(s+'T00:00:00Z').getTime()/86400000);   // UTC 日号, 防时区漂移
        const allDates = []; threads.forEach(t => (t.events||[]).forEach(e => e.date && allDates.push(e.date)));
        const todayStr = (d.generated_at||'').slice(0,10) || new Date().toISOString().slice(0,10);
        const todayDay = toDay(todayStr);
        let dMin = allDates.length ? Math.min(...allDates.map(toDay)) : todayDay;
        let dMax = todayDay; if (dMax <= dMin) dMax = dMin + 1;
        const PAD = 3, RANGE = 94;                                                     // 横向留白, 落点映射到 3%~97%
        const xOf = s => PAD + Math.max(0, Math.min(1, (toDay(s)-dMin)/(dMax-dMin))) * RANGE;
        const fmtMD = s => (s||'').slice(5);
        const dayStr = day => new Date(day*86400000).toISOString().slice(0,10);
        const fracs = [0, 0.34, 0.67, 1];
        const ticks = fracs.map(f => `<span class="htl-tick" style="left:${(PAD+f*RANGE).toFixed(2)}%">${f===1?'今 ':''}${fmtMD(dayStr(Math.round(dMin+f*(dMax-dMin))))}</span>`).join('');
        const grid = fracs.map(f => `<span class="htl-gl${f===1?' now':''}" style="left:${(PAD+f*RANGE).toFixed(2)}%"></span>`).join('');
        const rows = threads.map((t,i) => {
            const evs = (t.events||[]).filter(e => e.date);
            const xs = evs.map(e => xOf(e.date));
            const baseL = xs.length ? Math.min(...xs) : PAD, baseR = xs.length ? Math.max(...xs) : PAD;
            const lastDate = evs.length ? evs.reduce((a,b)=> a.date>b.date?a:b).date : null;
            const lastDay = lastDate ? toDay(lastDate) : null;
            const daysSince = lastDay==null ? 999 : Math.max(0, todayDay - lastDay);
            const recLabel = daysSince<=0 ? '今日活跃' : daysSince===1 ? '昨日活跃' : daysSince+'天前';
            const maxRank = Math.max(0, ...evs.map(e => e.rank||0));
            const dots = evs.map(e => {
                const r = e.rank||0, sz = (7 + Math.min(r,80)/80*8).toFixed(1);
                const cls = 'htl-ev' + (r>=50?' major':'') + (e.date===lastDate?' latest':'');
                return `<span class="${cls}" style="left:${xOf(e.date).toFixed(2)}%;width:${sz}px;height:${sz}px" title="${evEsc(e.date)}  ${evEsc(e.headline)} (热${Math.round(r)})"></span>`;
            }).join('');
            let badge = ''; if (maxRank>=50) badge += ' 🔴';
            try { if (t.last_date && Date.now()-new Date(t.last_date+'T00:00').getTime() <= 2.5*86400000) badge += ' 🆕'; } catch(e){}
            const base = `<span class="htl-base" style="left:${baseL.toFixed(2)}%;width:${Math.max(0,baseR-baseL).toFixed(2)}%"></span>`;
            return `<a class="htl-row" href="#hype-card-${i+1}">
                <div class="htl-label">
                    <div class="htl-th"><span class="htl-rank">${i+1}</span>🔥 ${evEsc(t.theme)}${badge}</div>
                    <div class="htl-sub">${recLabel} · ${t.n_events||evs.length}事件</div>
                </div>
                <div class="htl-track">${grid}${base}${dots}</div>
            </a>`;
        }).join('');
        return `<div class="htl">
            <div class="htl-row htl-axisrow"><div class="htl-label"></div><div class="htl-track htl-axis">${ticks}</div></div>
            ${rows}
          </div>
          <div class="htl-legend"><span class="htl-ev major" style="position:static;display:inline-block;width:12px;height:12px"></span>重大(≥50)<span class="htl-ev" style="position:static;display:inline-block;width:8px;height:8px;margin-left:6px"></span>普通<span style="margin-left:6px">·　圈越大越重要　·　越靠右越新　·　点行跳详情</span></div>`;
    })();
    const feed = d.threads.map((t,i)=> evRenderThread(t, i+1)).join('');
    root.innerHTML = `
      <div class="text-xs text-gray-400 mb-2 px-1">近 ${d.window_days} 天 · ${d.n_threads} 条炒作主线 · 更新 ${evEsc(d.generated_at)}</div>

        <div class="text-[11px] font-bold text-gray-500 mb-2 px-1">📋 主线时间线总览 <span class="font-normal text-gray-400">· 点任意主线跳到下方详情</span></div>
        <div>${summary}</div>
      </div>
      <div class="text-[11px] font-bold text-gray-400 mb-2 px-1">▼ 主线详情 Feed (时间线 / 逻辑 / 相关个股)</div>
      <div class="space-y-4">${feed}</div>`;
}
function evRenderThread(t, rank){
    const kws = t.keywords||[];
    const kw = kws.slice(0,6).map(evEsc).join(' · ');
    // ① 时间线 (竖向圆点, 新→旧, 关键内容标红)
    const tl = (t.events||[]).slice().reverse().map(e =>
        `<div class="relative pl-5 pb-2 last:pb-0">
            <div class="absolute left-0 top-1 w-2.5 h-2.5 rounded-full bg-white border-2 border-pink-400"></div>
            <div class="flex items-baseline gap-2">
              <span class="text-[11px] font-bold text-pink-500 tabular-nums shrink-0">${evEsc((e.date||'').slice(5))}</span>
              <span class="text-xs text-gray-700 leading-snug">${hlKey(e.headline, kws)}</span>
            </div>
        </div>`
    ).join('');
    // ② 逻辑 (传导链)
    const logicHtml = (t.logic && t.logic.length>10)
        ? `<div class="text-sm text-gray-700 leading-relaxed">${formatChain(t.logic)}</div>${t.logic_event?`<div class="text-[10px] text-gray-400 mt-1.5">📰 代表事件: ${evEsc(t.logic_event)}</div>`:''}`
        : `<div class="text-xs text-gray-400">(逻辑文字回填补全中…)</div>`;
    // ③ 相关个股
    const groups = (t.stock_groups||[]).map(evRenderGroup).join('');
    return `
    <div id="hype-card-${rank}" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 sm:p-5" style="scroll-margin-top:1rem">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-base font-extrabold text-gray-900">#${rank} 🔥 ${evEsc(t.theme)}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-purple-50 text-purple-600 font-medium">${evEsc(t.topic_class)}</span>
            ${_hypeBadges(t)}
          </div>
          <div class="text-[11px] text-gray-400 mt-0.5">关键词 · ${kw}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">${Math.round(t.heat)}</div>
          <div class="text-[10px] text-gray-400">${t.n_events}事件 · ${evEsc((t.first_date||'').slice(5))}~${evEsc((t.last_date||'').slice(5))}</div>
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-gray-50">
        <div class="text-[11px] font-bold text-gray-500 mb-2">📅 时间线 <span class="font-normal text-gray-400">· 新→旧 · 关键内容标红</span></div>
        <div class="relative">
          <div class="absolute left-[4px] top-1.5 bottom-2 w-0.5 bg-gradient-to-b from-purple-300 to-pink-200"></div>
          ${tl}
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-gray-50">
        <div class="text-[11px] font-bold text-gray-500 mb-2">🔗 逻辑 <span class="font-normal text-gray-400">· 传导链</span></div>
        <div class="p-3 bg-purple-50 rounded-lg border-l-4 border-purple-300">${logicHtml}</div>
      </div>
      <div class="mt-3 pt-3 border-t border-gray-50">
        <div class="text-[11px] font-bold text-gray-500 mb-2">🎯 相关个股 <span class="font-normal text-gray-400">· 按关系逻辑分框 · 涨红跌绿</span></div>
        <div class="space-y-2.5">${groups}</div>
      </div>
    </div>`;
}
function evRenderGroup(g){
    const st = REL_STYLE[g.relation_type] || REL_STYLE['主题概念'];
    const rows = (g.stocks||[]).map(s => {
        const up = (s.ret_pct!=null && s.ret_pct>=0);
        const retTxt = (s.ret_pct==null) ? '' : `<div class="text-xs font-bold" style="color:${up?'#dc2626':'#16a34a'}">${up?'+':''}${s.ret_pct}%</div>`;
        return `<div class="flex items-start justify-between gap-3 py-1">
            <div class="min-w-0">
              <div class="text-xs"><span class="font-semibold text-gray-800">${evEsc(s.name)}</span> <span class="text-[10px] text-gray-400">${evEsc(s.ts_code)}</span></div>
              <div class="text-[10px] text-gray-500 leading-snug mt-0.5">${hlKey(s.reason)}</div>
            </div>
            <div class="text-right shrink-0 leading-tight">${evSpark(s.spark, s.ret_pct)}${retTxt}</div>
        </div>`;
    }).join('');
    return `<div class="rounded-lg p-2" style="background:${st.dot}0d;border:1px solid ${st.dot}33">
        <div class="mb-1"><span class="text-[11px] font-bold px-1.5 py-0.5 rounded" style="background:${st.bg};color:${st.fg}">${evEsc(g.relation_type)}</span></div>
        <div class="divide-y divide-gray-50">${rows}</div>
    </div>`;
}

// 事件子 Tab 切换 (记忆当前 subtab)
document.querySelectorAll('#events-subtabs .event-subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        EV_CUR_SUBTAB = btn.dataset.subtab;
        document.querySelectorAll('#events-subtabs .event-subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.subtab === EV_CUR_SUBTAB));
        document.getElementById('events-hype').hidden = (EV_CUR_SUBTAB !== 'hype');
        document.getElementById('events-weekly').hidden = (EV_CUR_SUBTAB !== 'weekly');
        document.getElementById('events-daily').hidden = (EV_CUR_SUBTAB !== 'daily');
    });
});

// 自动加载
evLoadAndRender();
evLoadHype();

// 60s 原地刷新数据 (不整页 reload, 保持当前 tab / 当前那一天 / 滚动位置)
setInterval(() => { evLoadAndRender(); evLoadHype(); }, 60000);
</script>
</body>
</html>
