<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 ETF 轮动策略 · 多子策略决策引擎</title>
    <link href="https://cdn.staticfile.net/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.staticfile.net/echarts/5.4.3/echarts.min.js"></script>
    <script src="../assets/trade_chart.js"></script>
    <script src="../assets/auth.js"></script>
    <script src="../assets/activity.js"></script>
    <script src="../assets/compliance.js"></script>
    <script src="../assets/nav.js"></script>
    <script src="../assets/paywall.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<script>renderNav(true);</script>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 w-full">
<div class="space-y-6" data-strategy="ETF.honest">

    <!-- 标题 -->
    <div class="bg-white shadow rounded-lg p-4 sm:p-6">
        <h1 class="text-2xl sm:text-3xl font-bold text-indigo-700 mb-1" id="strat-title">🔄 ETF 轮动策略</h1>
        <p class="text-gray-500 text-sm mb-1" id="strat-subtitle"></p>
        <p class="text-xs text-indigo-600 mt-1" id="strat-weight"></p>
        <p class="text-xs text-gray-400 mt-1" id="strat-generated"></p>
    </div>

    <!-- Alpha 来源 -->
    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4">
        <h3 class="font-bold text-sm text-yellow-900">📖 Alpha 来源</h3>
        <p class="text-xs text-yellow-800 mt-1" id="strat-alpha"></p>
        <p class="text-xs text-yellow-800 mt-1" id="strat-pool"></p>
    </div>

    <!-- 关键指标 -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 sm:gap-4" id="metric-cards"></div>

    <!-- 净值曲线 -->
    <div class="bg-white shadow rounded-lg p-4 sm:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-3 sm:mb-4">📈 净值曲线 (归一化为 1.0)</h2>
        <div id="sub_chart" style="width: 100%; height: 360px;"></div>
    </div>

    <!-- 年度表 -->
    <div class="bg-white shadow rounded-lg p-4 sm:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-3 sm:mb-4">📊 年度表现</h2>
        <div class="scroll-x">
        <table class="min-w-full divide-y divide-gray-200 text-xs sm:text-sm">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left">年份</th>
                    <th class="px-4 py-2 text-right">收益</th>
                </tr>
            </thead>
            <tbody id="yearly-tbody" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
        </div>
    </div>

    <!-- 今日信号 (4 卡片) -->
    <div class="bg-white shadow rounded-lg p-4 sm:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-3 sm:mb-4">⭐ 今日信号</h2>
        <div id="strat-signals"></div>
    </div>

</div>
</main>

<script>renderFooter();</script>

<script>
const STRAT_KEY = document.querySelector('[data-strategy]').dataset.strategy;
const FMT_PCT = (x) => (x>=0?"+":"") + (x*100).toFixed(1) + "%";
const FMT_DEC = (x,n=3) => (x>=0?"+":"") + (x).toFixed(n);

const META_MAP = {
    "YAOGU.theme": {
        title: "🔥 妖股题材策略",
        sub:   "普涨题材(breadth>55)里放量(>2×5日均量)补涨的低位股, 集中≤5只, 移动止盈8% + 题材广度闸; 空仓资金风格轮动回补",
        alpha: "捕捉小盘题材妖股的补涨启动 — 题材投机/小盘普涨市独赚; 大盘趋势市靠风格轮动兜底",
        alpha_user: "捕捉「普涨题材里放量补涨的低位股」, 集中持仓 + 移动止盈 + 空仓风格轮动回补 (具体阈值不公开)",
        sub_user: "适配题材投机/小盘普涨行情. 题材轮动活跃、妖股频出时 Alpha 爆发最强.",
        pool:  "kpl 涨停原因自建题材的成员股 (普涨+放量+低位), 流通市值 10-1000 亿",
        weight: null, sigKey: "妖股题材",
    },
    "S2.G13": {
        title: "🏛️ 大盘高位策略",
        sub:   "流通市值 ≥ 200 亿 + 连续 3 日主力净流入 + 突破 20 日新高",
        alpha: "捕捉大盘股的趋势性布局 — 主力布局 + 突破 + 加固风控 (止损 -3% / MA40 macro)",
        alpha_user: "捕捉大盘股的「主力布局 + 突破」类趋势信号 (具体阈值不公开)",
        sub_user: "适配大盘股趋势行情. 当主力资金持续入场、市场风格切到价值蓝筹、突破前期高点时, 该策略的 Alpha 爆发最强.",
        pool:  "A 股大盘股 (流通市值 ≥ 200 亿元)",
        weight: 0.25, sigKey: "大盘高位",
    },
    "S4.V4": {
        title: "📈 低位横盘策略 (V4.1)",
        sub:   "MA5>MA20>MA60 多头 5-29 天 + 横盘 (MA5 斜率<0.5%) + 紧贴 MA5 (偏离度<2.5%) + Hidden Blacklist 前置过滤 (剔除主力暗中出货嫌疑)",
        alpha: "捕捉趋势中段的低波动洗盘窗口, EarlyStop 锁利 +8.4% (rqalpha-grade 17 项坑全修). V4.1 (2026-06-03) 新增 P18 hidden_distribution_blacklist 过滤, OOS V27 主组合年化 +2.39pp, MDD 改善 +1.17pp.",
        alpha_user: "捕捉「低位横盘形态」中的低波动洗盘窗口, 含锁利机制. V4.1 新增「主力暗中出货避雷」前置过滤层 (具体阈值不公开).",
        sub_user: "适配震荡上行行情中的低波动洗盘期. 当大盘已在上升通道、个股出现紧贴均线的窄幅盘整时, 该策略的 Alpha 爆发最强. V4.1 在选股前先剔除资金面上呈现「主力暗中出货」嫌疑的票, 进一步降低踩雷概率.",
        pool:  "A 股 amount_20d ≥ 5000万, IPO 后 ≥ 90 天, close ≥ 5 — V4.1 过滤掉 Hidden Blacklist (每日约 500 票)",
        weight: 0.70, sigKey: "低位横盘",
    },
    "ETF.honest": {
        title: "🔄 ETF 轮动策略",
        sub:   "在场满仓押注单一最强板块簇 (max1) + 5 分量 regime 择时 (中证全指趋势 / 板块广度 / 低波动 / 北向 / 资金结构) + 空仓日纳指(^NDX)>200日线时叠加 513100 纳指ETF (跨境腿 -8% 止损)",
        alpha: "境内: 按簇内申赎资金流 (proxy_C z) 选当下最强板块单押, 大盘 regime 转弱即空仓; 跨境: 空仓期若美股纳斯达克100处上升趋势, 切到纳指ETF 补收益. 现为 V27 主组合 30% 腿.",
        alpha_user: "境内板块轮动单押当下最强簇 + 大盘择时空仓 + 纳指趋势叠加补收益 (具体阈值不公开)",
        sub_user: "适配板块轮动 + 全球科技趋势行情. 集中押注当下最强板块, 大盘转弱时空仓避险, 空仓期若美股纳指处上升趋势则切到纳指ETF补收益. 回测自 2020 年策略成立日起.",
        pool:  "境内 45 板块 ETF 簇 + 跨境 513100 纳指ETF",
        weight: 0.30, sigKey: null,
    },
};

async function loadJSON(p) {
    const r = await fetch(p + "?t=" + Date.now());
    if (!r.ok) throw new Error(p);
    return r.json();
}

(async function () {
    const me = await pwMe();
    pwUserBar(me);
    const sig = await pwSignals(me).catch(_=>null);
    const data = sig ? sig.data : null;
    const LOCKED = sig ? sig.locked : true;
    const eq = await pwGet("/equity").catch(_=>null);
    if (!data) { document.getElementById('strat-subtitle').textContent = "⚠ 数据尚未生成"; return; }

    const m = META_MAP[STRAT_KEY];
    document.title = m.title + " · 多子策略决策引擎";
    document.getElementById('strat-title').textContent = m.title;
    document.getElementById('strat-subtitle').textContent = isAdmin() ? m.sub : (m.sub_user || m.sub);
    document.getElementById('strat-weight').textContent =
        m.weight === null ? "独立运行 — 不并入主组合" : `在 V27 主组合中占比 ${(m.weight*100).toFixed(0)}%`;
    document.getElementById('strat-generated').textContent =
        `数据日期 ${data.meta.data_date} · 站点生成 ${data.meta.generated_at}`;
    document.getElementById('strat-alpha').textContent = isAdmin() ? m.alpha : (m.alpha_user || m.alpha);
    document.getElementById('strat-pool').textContent  = "选股池: " + m.pool;

    // 指标
    const single = data.singles.find(s => s.name === STRAT_KEY);
    if (single) {
        const cards = [
            ['累计收益', FMT_PCT(single.ret), 'text-green-600'],
            ['年化',    FMT_PCT(single.ann_ret), 'text-green-600'],
            ['Sharpe',  FMT_DEC(single.sharpe), 'text-indigo-600'],
            ['Calmar',  FMT_DEC(single.calmar), 'text-indigo-600'],
            ['最大回撤', FMT_PCT(single.mdd),   'text-red-500'],
        ];
        document.getElementById('metric-cards').innerHTML = cards.map(([k,v,c]) =>
            `<div class="bg-white shadow rounded-lg p-3 sm:p-4">
                <div class="text-xs text-gray-500">${k}</div>
                <div class="metric-num text-2xl font-bold ${c}">${v}</div>
            </div>`
        ).join('');

        // 年度
        const yrs = Object.keys(single.yearly || {}).sort();
        document.getElementById('yearly-tbody').innerHTML = yrs.map(y => {
            const v = single.yearly[y];
            return `<tr class="${v<0?'bg-red-50':''}">
                <td class="px-4 py-2 font-medium">${y}</td>
                <td class="px-4 py-2 text-right ${v>=0?'text-green-600':'text-red-500'}">${FMT_PCT(v)}</td>
            </tr>`;
        }).join('');
    }

    // 净值曲线
    if (eq && eq[STRAT_KEY]) {
        const chart = echarts.init(document.getElementById('sub_chart'));
        chart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: 50, right: 30, top: 30, bottom: 60 },
            xAxis: { type: 'category', data: eq.dates, axisLabel: { rotate: 30 } },
            yAxis: { type: 'value', name: '净值' },
            series: [{
                name: m.title, type: 'line', smooth: true, showSymbol: false,
                data: eq[STRAT_KEY],
                lineStyle: { width: 2, color: '#6366f1' },
                areaStyle: { color: 'rgba(99,102,241,0.08)' },
            }],
        });
        window.addEventListener('resize', () => chart.resize());
    }

    // 今日信号
    let sigHtml = '';
    const _sd = (m.sigKey && data.daily_signals) ? data.daily_signals[m.sigKey] : null;
    if (LOCKED && (_sd || (STRAT_KEY === 'ETF.honest' && data.etf_state))) {
        const counts = _sd ? [
            {label:"明日信号", n: (_sd.buy_today_count ?? (_sd.buy_today||[]).length)},
            {label:"跟踪中", n: (_sd.holding_count ?? 0)},
            {label:"离场", n: (_sd.sell_today_count ?? 0)},
        ] : [];
        document.getElementById('strat-signals').innerHTML = pwLockCard({title:"🔒 完整信号已锁定", sub:"明日重磅信号 · 持续跟踪 · 离场提示 · 历史明细 — 付费会员可见", counts});
        return;
    }
    if (m.sigKey && data.daily_signals && data.daily_signals[m.sigKey]) {
        const s = data.daily_signals[m.sigKey];
        const isEmpty = (!s.holding||s.holding.length===0)&&(!s.buy_today||s.buy_today.length===0)&&(!s.sell_today||s.sell_today.length===0);

        if (isEmpty) {
            sigHtml += `<div class="bg-gray-50 rounded-lg p-6 text-center mb-4">
                <p class="text-base text-gray-600">💤 当前观望</p>
                <p class="text-xs text-gray-500 mt-2">当前无活跃信号，等待新机会出现</p>
            </div>`;
        }

        sigHtml += '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">';

        // 持仓
        sigHtml += '<div class="bg-blue-50 rounded-lg p-4"><h3 class="text-sm font-bold text-blue-900 mb-3">📦 持续跟踪中 (' + (s.holding||[]).length + ')</h3>';
        if (s.holding && s.holding.length > 0) {
            sigHtml += '<ul class="space-y-2">' + s.holding.map(h =>
                `<li class="bg-white px-3 py-2 rounded text-xs flex justify-between flex-wrap gap-1">
                    <span class="font-mono font-bold text-blue-700">${h.ts_code}</span>
                    <span class="text-gray-500">纳入 ${h.entry_date}</span>
                </li>`
            ).join('') + '</ul>';
        } else sigHtml += '<p class="text-xs text-gray-500">暂无跟踪标的</p>';
        sigHtml += '</div>';

        // 卖出
        sigHtml += '<div class="bg-red-50 rounded-lg p-4"><h3 class="text-sm font-bold text-red-900 mb-3">📤 明日离场信号 (' + (s.sell_today||[]).length + ')</h3>';
        if (s.sell_today && s.sell_today.length > 0) {
            sigHtml += '<ul class="space-y-2">' + s.sell_today.map(x =>
                `<li class="bg-white px-3 py-2 rounded text-xs">
                    <div class="flex justify-between flex-wrap gap-1">
                        <span class="font-mono font-bold text-red-700">${x.ts_code}</span>
                        <span class="${x.ret>=0?'text-green-600':'text-red-500'} font-bold">${FMT_PCT(x.ret)}</span>
                    </div>
                    <div class="text-gray-500 mt-1">纳入 ${x.entry_date} · ${pwReason(x.reason)}</div>
                </li>`
            ).join('') + '</ul>';
        } else sigHtml += '<p class="text-xs text-gray-500">今日无离场</p>';
        sigHtml += '</div>';

        // 买入
        sigHtml += '<div class="bg-green-50 rounded-lg p-4"><h3 class="text-sm font-bold text-green-900 mb-3">🎯 明日重磅信号 (' + Math.min(3,(s.buy_today||[]).length) + ') · 候选 (' + Math.max(0,(s.buy_today||[]).length-3) + ')</h3>';
        if (s.buy_today && s.buy_today.length > 0) {
            sigHtml += '<ul class="space-y-2">' + s.buy_today.slice(0,8).map((item,i) => {
                const ts = (typeof item === 'string') ? item : (item.ts_code || '?');
                const p_up = (typeof item === 'object' && item.p_up != null) ? item.p_up : null;
                let star = '';
                if (i===0) star = '<span class="text-yellow-500 text-lg">★★★</span><span class="text-xs text-gray-400 ml-1">重磅</span>';
                else if (i===1) star = '<span class="text-yellow-500">★★</span>';
                else if (i===2) star = '<span class="text-yellow-500">★</span>';
                else star = '<span class="text-xs text-gray-400">候选</span>';
                const pupBadge = (p_up !== null) ? `<span class="text-xs text-blue-600 ml-2" title="综合信号强度">强度 ${(p_up*100).toFixed(0)}</span>` : '';
                return `<li class="bg-white px-3 py-2 rounded text-xs flex justify-between items-center">
                    <span class="flex items-center"><span class="font-mono font-bold text-green-700">${ts}</span>${pupBadge}</span>
                    <span>${star}</span>
                </li>`;
            }).join('') + '</ul>';
        } else sigHtml += '<p class="text-xs text-gray-500">今日暂无信号</p>';
        sigHtml += '</div>';

        // 历史出清
        sigHtml += '<div class="bg-gray-100 rounded-lg p-4"><h3 class="text-sm font-bold text-gray-700 mb-3">✓ 近期已离场 (' + (s.exited_recent||[]).length + ')</h3>';
        if (s.exited_recent && s.exited_recent.length > 0) {
            const _exAll = s.exited_recent.slice().reverse();   // 最近的在前
            const _exLi = x =>
                `<li class="bg-white px-3 py-2 rounded text-xs">
                    <div class="flex justify-between flex-wrap gap-1">
                        <span class="font-mono text-gray-700">${x.ts_code}</span>
                        <span class="${x.ret>=0?'text-green-600':'text-red-500'} font-bold">${FMT_PCT(x.ret)}</span>
                    </div>
                    <div class="text-gray-500 mt-1">纳入 ${x.entry_date} → 退 ${x.exit_date} · ${pwReason(x.reason)}</div>
                </li>`;
            sigHtml += '<ul class="space-y-2">' + _exAll.slice(0,3).map(_exLi).join('') + '</ul>';
            if (_exAll.length > 3) {
                sigHtml += '<details class="mt-2"><summary class="list-none cursor-pointer text-xs text-indigo-600 font-medium hover:text-indigo-800 select-none">查看全部 ' + _exAll.length + ' 笔 ▾</summary>'
                    + '<ul class="space-y-2 mt-2">' + _exAll.slice(3).map(_exLi).join('') + '</ul></details>';
            }
        } else sigHtml += '<p class="text-xs text-gray-500">近期无离场</p>';
        sigHtml += '</div>';

        sigHtml += '</div>';
    } else if (STRAT_KEY === 'ETF.honest' && data.etf_state) {
        const e = data.etf_state;
        sigHtml = `<div class="bg-yellow-50 rounded-lg p-4">
            <p class="text-sm text-gray-700 mb-2">最近运行: <span class="font-mono font-bold">${e.last_run_date}</span></p>
            <p class="text-sm text-gray-700">当前累计净值: <span class="font-mono font-bold text-green-600">${(e.last_equity||1.0).toFixed(3)}</span></p>
            <p class="text-sm text-gray-700">持仓数量: <span class="font-mono font-bold">${(e.holdings||[]).length}</span></p>`;
        if (e.holdings && e.holdings.length > 0) {
            sigHtml += '<ul class="mt-2 ml-4 list-disc text-sm">';
            for (const h of e.holdings) sigHtml += `<li>${h.ts_code || h}</li>`;
            sigHtml += '</ul>';
        } else {
            sigHtml += '<p class="text-xs text-gray-500 mt-2">空仓 (macro 信号为熊市或无合格板块)</p>';
        }
        sigHtml += `</div>`;
        const _eth = (e.trade_history || []).slice().reverse();
        if (_eth.length > 0) {
            sigHtml += '<div class="bg-gray-100 rounded-lg p-4 mt-3"><h3 class="text-sm font-bold text-gray-700 mb-3">📦 历史持仓 (' + _eth.length + ') <span class="text-xs text-indigo-400 font-normal">· 点行看K线</span></h3>';
            sigHtml += '<ul class="space-y-2">' + _eth.slice(0,15).map((t,i)=>tradeChartLi(t,'eth'+i)).join('') + '</ul>';
            if (_eth.length > 15) sigHtml += '<details class="mt-2"><summary class="list-none cursor-pointer text-xs text-indigo-600 font-medium hover:text-indigo-800 select-none">查看全部 ' + _eth.length + ' 笔 ▾</summary><ul class="space-y-2 mt-2">' + _eth.slice(15).map((t,i)=>tradeChartLi(t,'eth'+(i+15))).join('') + '</ul></details>';
            sigHtml += '</div>';
        }
    } else {
        sigHtml = '<p class="text-gray-500">无今日信号数据</p>';
    }

    document.getElementById('strat-signals').innerHTML = sigHtml;
})();
</script>
</body>
</html>
