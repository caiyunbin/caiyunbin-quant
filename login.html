<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 多子策略决策引擎</title>
    <script src="https://cdn.staticfile.net/tailwindcss/2.2.19/tailwind.min.css"></script>
    <script src="assets/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-50 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-xl rounded-lg p-10 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-700">🚀 多子策略决策引擎</h1>
            <p class="text-sm text-gray-500 mt-2">A 股每日量化信号 · 仅限授权访问</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">访问密码</label>
                <input
                    type="password"
                    id="password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="请输入访问密码"
                    autofocus
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md font-medium hover:bg-indigo-700">
                登录
            </button>
            <p id="err-msg" class="text-red-500 text-sm text-center hidden">密码错误, 请重试</p>
        </form>

        <div class="mt-8 text-xs text-gray-400 border-t pt-4">
            <p>⚠ 本站内容仅供研究参考, 不构成任何投资建议.</p>
            <p class="mt-1">访问授权由本人控制, 凭证 7 天有效, 过期需重新登录.</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const ok = await tryLogin(pwd);
            if (ok) {
                // 回跳来路或主页
                const back = new URLSearchParams(window.location.search).get('back');
                window.location.href = back ? decodeURIComponent(back) : "index.html";
            } else {
                document.getElementById('err-msg').classList.remove('hidden');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
